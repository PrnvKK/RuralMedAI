services:
  postgres:
    image: postgres:16-alpine
    container_name: parchee-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruralmed}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ruralmed}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: parchee-backend
    shm_size: '2g'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ruralmed}
      AES_256_KEY: ${AES_256_KEY}
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_TRANSCRIBE_MODEL: ${GEMINI_TRANSCRIBE_MODEL:-gemini-3.5-transcribe}
      GEMINI_EXTRACT_MODEL: ${GEMINI_EXTRACT_MODEL:-gemini-3.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8003:8003"
    volumes:
      - backend_data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: parchee-frontend
    environment:
      # These URLs are used by browser-side code, so they must point at the
      # host-published backend port rather than the Docker service hostname.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8003
      NEXT_PUBLIC_WS_URL: ws://localhost:8003/ws/live-consultation
      NEXT_PUBLIC_PARCHEE_SEND_INTERVAL_MS: ${NEXT_PUBLIC_PARCHEE_SEND_INTERVAL_MS:-500}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_data:
