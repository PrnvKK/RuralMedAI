[project]
name = "parchee-edge"
version = "0.1.0"
description = "Local-first medical scribe and claim-readiness assistant for low-connectivity rural clinics"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "psycopg2-binary>=2.9.9",
    "cryptography>=44.0.0",
    "httpx>=0.27.0",
    "simple-icd-10-cm",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "spacy>=3.8",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "scipy>=1.12.0",
    "huggingface-hub>=0.26.0",
    "tqdm>=4.66.0",
    "alembic>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
lint.select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
